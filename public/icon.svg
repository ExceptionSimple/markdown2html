<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1325" />
      <stop offset="45%" stop-color="#081822" />
      <stop offset="100%" stop-color="#03261e" />
    </linearGradient>

    <!-- Squircle Border Highlight -->
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#22d3ee" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glass Window Fill Gradient -->
    <linearGradient id="glassWindow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182338" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0d1829" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glass Window Border -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#334155" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.25" />
    </linearGradient>

    <!-- Emerald Brand Gradient for 'M' -->
    <linearGradient id="emeraldM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Cyan Brand Gradient for HTML Brackets -->
    <linearGradient id="cyanBrackets" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Slash Gradient -->
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Flow Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Specular Highlight for Window -->
    <linearGradient id="specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="desktopShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.7" />
    </filter>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- ================= BASE CANVAS SQUIRCLE ================= -->
  <!-- Outer Glow & Shadow -->
  <rect x="36" y="36" width="440" height="440" rx="104" fill="url(#bgGrad)" filter="url(#desktopShadow)" />
  <rect x="36" y="36" width="440" height="440" rx="104" fill="url(#ambientGlow)" />
  <rect x="37" y="37" width="438" height="438" rx="103" fill="none" stroke="url(#squircleBorder)" stroke-width="1.75" />

  <!-- ================= FLOATING GLASS WINDOW ================= -->
  <g transform="translate(68, 70)">
    <!-- Window Body -->
    <rect x="0" y="0" width="376" height="372" rx="34" fill="url(#glassWindow)" stroke="url(#glassBorder)" stroke-width="1.5" />
    
    <!-- Top Glass Sheen -->
    <rect x="1" y="1" width="374" height="140" rx="33" fill="url(#specular)" />

    <!-- Window Controls (Mac Style Jewels) -->
    <circle cx="34" cy="30" r="6.5" fill="#ef4444" />
    <circle cx="34" cy="30" r="5" fill="#f87171" opacity="0.6" />
    <circle cx="56" cy="30" r="6.5" fill="#f59e0b" />
    <circle cx="56" cy="30" r="5" fill="#fbbf24" opacity="0.6" />
    <circle cx="78" cy="30" r="6.5" fill="#10b981" />
    <circle cx="78" cy="30" r="5" fill="#34d399" opacity="0.6" />

    <!-- Subtle Header Divider -->
    <line x1="0" y1="58" x2="376" y2="58" stroke="#334155" stroke-opacity="0.5" stroke-width="1.2" />

    <!-- Header Mini Badge: Live Sync Indicator -->
    <g transform="translate(290, 20)">
      <rect x="0" y="0" width="62" height="20" rx="10" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1" />
      <circle cx="12" cy="10" r="3" fill="#34d399" />
      <text x="34" y="14" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="bold" letter-spacing="0.5">SYNC</text>
    </g>

    <!-- ================= MAIN EMBLEM: M ➜ </> ================= -->
    <g filter="url(#glyphShadow)">
      <!-- 1. Stylized Markdown 'M' Symbol -->
      <g transform="translate(32, 102)">
        <!-- The Bold 'M' Silhouette -->
        <path d="M 8 10
                 C 8 4.5 12.5 0 18 0
                 L 44 0
                 C 49 0 53.5 2.8 55.5 7.2
                 L 78 54
                 L 100.5 7.2
                 C 102.5 2.8 107 0 112 0
                 L 138 0
                 C 143.5 0 148 4.5 148 10
                 L 148 150
                 C 148 155.5 143.5 160 138 160
                 L 116 160
                 C 110.5 160 106 155.5 106 150
                 L 106 72
                 L 88 112
                 C 86 116.5 81.5 119.5 76.5 119.5
                 C 71.5 119.5 67 116.5 65 112
                 L 47 72
                 L 47 150
                 C 47 155.5 42.5 160 37 160
                 L 18 160
                 C 12.5 160 8 155.5 8 150
                 Z"
              fill="url(#emeraldM)" />

        <!-- Markdown Signature Down-Arrow Badge -->
        <g transform="translate(76.5, 140)">
          <!-- Circular Accent Pill -->
          <circle cx="0" cy="0" r="15" fill="#022c22" stroke="#34d399" stroke-width="1.8" />
          <path d="M 0 -7 L 0 7 M -5 2 L 0 7 L 5 2"
                fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </g>
      </g>

      <!-- 2. Dynamic Conversion Pulse Arrow -->
      <g transform="translate(196, 172)">
        <path d="M -4 14 L 18 14 M 10 4 L 20 14 L 10 24"
              fill="none" stroke="url(#arrowGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- 3. HTML Code Tag Emblem </ > -->
      <g transform="translate(230, 102)">
        <!-- Opening Tag Bracket < -->
        <path d="M 38 22
                 L 8 76
                 C 6 80 6 86 8 90
                 L 38 144"
              fill="none" stroke="url(#cyanBrackets)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Center Slash / -->
        <line x1="72" y1="12" x2="44" y2="154"
              stroke="url(#slashGrad)" stroke-width="11" stroke-linecap="round" opacity="0.85" />

        <!-- Closing Tag Bracket > -->
        <path d="M 78 22
                 L 108 76
                 C 110 80 110 86 108 90
                 L 78 144"
              fill="none" stroke="url(#cyanBrackets)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- ================= BOTTOM FORMATTING ACCENT BAR ================= -->
    <g transform="translate(34, 304)">
      <!-- Background track -->
      <rect x="0" y="0" width="308" height="34" rx="12" fill="#090d16" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
      
      <!-- Rich Text Typography Preview Elements -->
      <!-- H1 Header Color Indicator -->
      <rect x="16" y="11" width="5" height="12" rx="2.5" fill="#34d399" />
      <rect x="26" y="13" width="46" height="8" rx="4" fill="#34d399" />

      <!-- Divider dot -->
      <circle cx="86" cy="17" r="2.5" fill="#334155" />

      <!-- Text Line Indicators -->
      <rect x="100" y="14" width="38" height="6" rx="3" fill="#94a3b8" opacity="0.6" />
      <rect x="144" y="14" width="54" height="6" rx="3" fill="#94a3b8" opacity="0.4" />

      <!-- Divider dot -->
      <circle cx="212" cy="17" r="2.5" fill="#334155" />

      <!-- Terminal / Output Code Chip -->
      <rect x="226" y="9" width="66" height="16" rx="5" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
      <text x="259" y="20.5" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" font-weight="bold" text-anchor="middle">&lt;HTML/&gt;</text>
    </g>
  </g>
</svg>
